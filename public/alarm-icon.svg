<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0d1117"/>
  <circle cx="50" cy="54" r="28" stroke="url(#grad1)" stroke-width="6" fill="#161b22" filter="url(#glow)"/>
  <!-- Clock bells / ears -->
  <path d="M 28 28 L 38 36" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 72 28 L 62 36" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>
  <!-- Clock hands pointing at alarm time -->
  <line x1="50" y1="54" x2="50" y2="38" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="54" x2="62" y2="54" stroke="#ff3b30" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="54" r="4" fill="#ffffff"/>
  <!-- Lightning flash or pulse signal -->
  <path d="M 50 14 L 54 22 L 46 22 Z" fill="#ffcc00"/>
</svg>
